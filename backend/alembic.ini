# ── Alembic — PHG BUILD IA ────────────────────────────────────────────────────
[alembic]
# Chemin vers le dossier des migrations (relatif à ce fichier)
script_location = alembic

# DATABASE_URL est lu depuis l'environnement dans env.py — ne pas le mettre ici
sqlalchemy.url =

# Activer les migrations de données imbriquées
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
